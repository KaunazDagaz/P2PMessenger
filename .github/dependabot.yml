version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      avalonia:
        patterns:
          - Avalonia*
    ignore:
      - dependency-name: xunit.v3.mtp-v2
        update-types:
          - version-update:semver-major
      - dependency-name: Xamarin.AndroidX.Core.SplashScreen
        versions:
          - '1.2.0.3'

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
